# TFinder AE2 · Entorno de despliegue fase 1 (solo Tailscale)
# El stack se gestiona desde este directorio con Docker Compose.
#
# Convencion de puertos "localhost vs dentro del contenedor":
#   - Desde el HOST usas: 127.0.0.1:5432, 127.0.0.1:6390, 127.0.0.1:5673, 127.0.0.1:1025
#   - Dentro del contenedor (B02+) usas los nombres de servicio: postgres, redis, rabbitmq
#
# Los puertos de administracion y datos escuchan solo en 127.0.0.1.
# El frontend escucha solo en la IP de Tailscale para la fase 1.

name: tfinder

services:
  # ---------------- PostgreSQL 16 ----------------
  postgres:
    image: postgres:16-alpine
    container_name: tfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-mesas_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tfinder-pg:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfinder} -d ${POSTGRES_DB:-mesas_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------- Redis 7 ----------------
  redis:
    image: redis:7-alpine
    container_name: tfinder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - tfinder-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- RabbitMQ (management) ----------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tfinder-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tfinder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS requerido}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - tfinder-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------- MailHog (email sandbox) ----------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tfinder-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ---------------- Servicios AE2 ----------------
  mesas-api:
    build:
      context: .
      args:
        SERVICE: mesas_api
    container_name: tfinder-mesas-api
    restart: unless-stopped
    environment:
      SERVICIO: mesas-api
      MESAS_DATABASE_URL: ${MESAS_DATABASE_URL:?MESAS_DATABASE_URL requerida}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requerida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-30}
      QR_SECRET: ${QR_SECRET:?QR_SECRET requerido}
      DEBUG: ${DEBUG:-false}
      MESAS_EMAIL: ${MESAS_EMAIL:-email_svc@tfinder.dev}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  builds-api:
    build:
      context: .
      args:
        SERVICE: builds_api
    container_name: tfinder-builds-api
    restart: unless-stopped
    environment:
      SERVICIO: builds-api
      BUILDS_DATABASE_URL: ${BUILDS_DATABASE_URL:?BUILDS_DATABASE_URL requerida}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requerida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      MESA_URL: ${MESA_URL:-http://mesas-api:8001}
      MESAS_URL: ${MESAS_URL:-http://mesas-api:8001}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-30}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      PORT: "8001"
    ports:
      - "127.0.0.1:8002:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  feed-api:
    build:
      context: .
      args:
        SERVICE: feed_api
    container_name: tfinder-feed-api
    restart: unless-stopped
    environment:
      SERVICIO: feed-api
      FEED_DATABASE_URL: ${FEED_DATABASE_URL:?FEED_DATABASE_URL requerida}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requerida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      MESA_URL: ${MESA_URL:-http://mesas-api:8001}
      MESAS_URL: ${MESAS_URL:-http://mesas-api:8001}
      UPLOAD_FILES_DIR: ${UPLOAD_FILES_DIR:-/data/uploads}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-30}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      PORT: "8001"
    ports:
      - "127.0.0.1:8003:8001"
    volumes:
      - tfinder-uploads:${UPLOAD_FILES_DIR:-/data/uploads}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notif-api:
    build:
      context: .
      args:
        SERVICE: notif_api
    container_name: tfinder-notif-api
    restart: unless-stopped
    environment:
      SERVICIO: notif-api
      NOTIF_DATABASE_URL: ${NOTIF_DATABASE_URL:?NOTIF_DATABASE_URL requerida}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requerida}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-3}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@tfinder.local}
      MESAS_URL: ${MESAS_URL:-http://mesas-api:8001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-30}
      MESAS_EMAIL: ${MESAS_EMAIL:-email_svc@tfinder.dev}
      MESAS_PASSWORD: ${MESAS_PASSWORD:?MESAS_PASSWORD requerido}
      PDF_DIR: ${PDF_DIR:-/data/pdf}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      PORT: "8001"
    ports:
      - "127.0.0.1:8004:8001"
    volumes:
      - tfinder-pdf:${PDF_DIR:-/data/pdf}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MESAS_API: /mesas-api
        VITE_BUILDS_API: /builds-api
        VITE_FEED_API: /feed-api
        VITE_NOTIF_API: /notif-api
        VITE_AUTH_MODE: api
        VITE_API_MODE: api
    container_name: tfinder-frontend
    restart: unless-stopped
    ports:
      - "100.68.203.96:5173:80"
    depends_on:
      - mesas-api
      - builds-api
      - feed-api
      - notif-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  tfinder-pg:
  tfinder-redis:
  tfinder-rabbitmq:
  tfinder-uploads:
  tfinder-pdf:
