name: tfinder

services:
  postgres:
    image: postgres:16-alpine
    container_name: tfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:-mesas_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tfinder-pg:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfinder} -d ${POSTGRES_DB:-mesas_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tfinder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - tfinder-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tfinder-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tfinder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS requerido}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - tfinder-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mesas-api:
    build:
      context: .
      args:
        SERVICE: mesas_api
    container_name: tfinder-mesas-api
    restart: unless-stopped
    environment:
      SERVICIO: mesas-api
      MESAS_DATABASE_URL: ${MESAS_DATABASE_URL:?MESAS_DATABASE_URL requerida}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL requerida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-30}
      QR_SECRET: ${QR_SECRET:?QR_SECRET requerido}
      DEBUG: ${DEBUG:-false}
      MESAS_EMAIL: ${MESAS_EMAIL:-email_svc@tfinder.dev}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      PORT: "8001"
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MESAS_API: /mesas-api
        VITE_AUTH_MODE: api
        VITE_API_MODE: api
    container_name: tfinder-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:80"
    depends_on:
      mesas-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  tfinder-pg:
  tfinder-redis:
  tfinder-rabbitmq: