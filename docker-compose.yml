name: tfinder

services:
  postgres:
    image: postgres:16-alpine
    container_name: tfinder-postgres
    environment:
      POSTGRES_USER: tfinder
      POSTGRES_PASSWORD: tfinder
      POSTGRES_DB: mesas_db
    ports:
      - "5432:5432"
    volumes:
      - tfinder-pg:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfinder -d mesas_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tfinder-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tfinder-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tfinder
      RABBITMQ_DEFAULT_PASS: tfinder
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mesas-api:
    build:
      context: .
      args:
        SERVICE: mesas_api
    container_name: tfinder-mesas-api
    environment:
      SERVICIO: mesas-api
      MESAS_DATABASE_URL: postgresql://tfinder:tfinder@postgres:5432/mesas_db
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://tfinder:tfinder@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-1440}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-DemoTFinder123!}
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MESAS_API: /mesas-api
        VITE_AUTH_MODE: api
        VITE_API_MODE: api
    container_name: tfinder-frontend
    ports:
      - "5173:80"
    depends_on:
      - mesas-api

volumes:
  tfinder-pg: